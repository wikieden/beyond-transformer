<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViT 切小块</title><link rel="stylesheet" href="anim.css">
<style>svg text.big{font-size:15px}svg text.cap{font-size:15px;font-weight:500}svg text.v{font-size:12px}</style></head>
<body><main>
<h1>第 44 章 · ViT：一张图怎么变成一句话</h1>
<p class="sub">配套讲义：<a href="../lessons/44-vit.html">第 44 章 · ViT：把图片切成小块，当成一句话</a>。4 × 4 的小灰度图，P = 2 切成 4 块；E 第 1 列算平均亮度，第 2 列算"上半行减下半行"。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 400"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="p">自己拖：224 × 224 的图，小块边长 P</label><input type="range" id="p" min="0" max="5" step="1" value="2"><span id="pv">16</span></div>
<p class="note">看点：① 小图按 2 × 2 切成 4 块，每块按行展平成 4 个数；② 每块乘同一个 E 变成 2 个数，前面加 [class]，再加位置编码，得到 5 × 2 的 z₀；③ 序列进 encoder（不遮挡），只取 [class] 那一行去分类。滑块：P 越小，块越多，注意力分数表按 N² 涨。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
const IMG=[[1,2,0,1],[3,4,1,0],[0,0,5,6],[1,1,7,8]];
const PC=['var(--teal)','var(--purple)','var(--amber)','var(--warm)'];
const PATCH=[[1,2,3,4],[0,1,1,0],[0,0,1,1],[5,6,7,8]];
const EMB=[[2.5,-4],[0.5,0],[0.5,-2],[6.5,-4]];
const POS=[[0,0],[0.1,0.1],[0.2,0.2],[0.3,0.3],[0.4,0.4]];
const Z0=[[0,0],[2.6,-3.9],[0.7,0.2],[0.8,-1.7],[6.9,-3.6]];
const PS=[8,14,16,28,32,56];
const n=v=>String(Math.round(v*10)/10);
const ST=[
 {cap:'一张 4 × 4 的灰度图（C = 1），每格一个像素值'},
 {cap:'第一步：按 P = 2 切开，N = 16 / 2² = 4 块',split:true},
 {cap:'每块按行展平：2 × 2 → 4 个数，从左到右、从上到下排',split:true,flat:true},
 {cap:'第二步：每块乘同一个 E（4 × 2）→ 2 个数',split:true,flat:true,emb:true},
 {cap:'最前面加 [class]，再加位置编码 → z₀（5 × 2）',z0:true},
 {cap:'第三步：进 L 层 encoder（每个块都能看所有块），只取 [class] 那一行',enc:true}];
const FR=[];ST.forEach((_,i)=>{FR.push(i);FR.push(i)});
let k=0,custom=null;
function grid(split){const s=46,x0=40,y0=90;
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){const pi=(r>>1)*2+(c>>1),g=split?10:0;
    const x=x0+c*s+(c>1?g:0),y=y0+r*s+(r>1?g:0),v=IMG[r][c];
    el('rect',{x,y,width:s-2,height:s-2,rx:4,fill:split?PC[pi]:'var(--muted)',opacity:.15+v/10},sv);
    txt(String(v),{x:x+s/2-1,y:y+s/2+5,'text-anchor':'middle',class:'big'},sv)}
  if(split)for(let i=0;i<4;i++){const x=x0+(i%2)*(2*s+10),y=y0+(i>>1)*(2*s+10);txt(`块 ${i+1}`,{x:x+s,y:i<2?y-6:y+2*s+12,'text-anchor':'middle',class:'v'},sv).style.fill=PC[i]}}
function rowv(x,y,vals,c,lab,w=34){if(lab)txt(lab,{x:x-8,y:y+17,'text-anchor':'end',class:'v'},sv).style.fill=c||'var(--text)';
  vals.forEach((v,i)=>{el('rect',{x:x+i*w,y,width:w-3,height:24,rx:4,fill:c||'var(--muted)',opacity:.18},sv);
    txt(n(v),{x:x+i*w+(w-3)/2,y:y+17,'text-anchor':'middle',class:'v'},sv)})}
function draw(){
  clear(sv);
  if(custom!==null){const P=custom,g=224/P,N=g*g;
    txt(`P = ${P}：(224 / ${P})² = ${N} 块，每块 ${P*P*3} 个数，序列 ${N+1}，分数表 ${(N+1)**2} 格`,{x:340,y:30,'text-anchor':'middle',class:'cap'},sv);
    const S=300,x0=60,y0=60,c=S/g;el('rect',{x:x0,y:y0,width:S,height:S,fill:'var(--accent-bg)',stroke:'var(--line)'},sv);
    for(let i=1;i<g;i++){el('line',{x1:x0+i*c,y1:y0,x2:x0+i*c,y2:y0+S,stroke:'var(--accent)','stroke-width':g>20?.4:1},sv);el('line',{x1:x0,y1:y0+i*c,x2:x0+S,y2:y0+i*c,stroke:'var(--accent)','stroke-width':g>20?.4:1},sv)}
    const base=(197)**2,r=(N+1)**2/base,bw=Math.min(250,250*Math.sqrt(r));
    txt('注意力分数表的大小（面积，P = 16 为参照）',{x:400,y:80,class:'m'},sv);
    el('rect',{x:400,y:95,width:Math.min(250,250*Math.sqrt(1)),height:Math.min(250,250),fill:'none',stroke:'var(--line)','stroke-dasharray':'4 4'},sv);
    el('rect',{x:400,y:95,width:bw,height:bw,fill:r>1?'var(--warm)':'var(--teal)',opacity:.35},sv);
    txt(`是 P = 16 的 ${r<1?r.toFixed(3):r.toFixed(1)} 倍`,{x:400,y:370,class:'big'},sv).style.fill=r>1?'var(--warm)':'var(--teal)';
    return}
  const f=ST[FR[k]];txt(f.cap,{x:340,y:30,'text-anchor':'middle',class:'cap'},sv);
  if(f.z0||f.enc){const x=150,y0=70;
    const labs=['[class]','块 1','块 2','块 3','块 4'];
    txt('投影结果',{x:x+34,y:y0-8,'text-anchor':'middle',class:'m'},sv);txt('+ 位置',{x:x+130,y:y0-8,'text-anchor':'middle',class:'m'},sv);txt('= z₀',{x:x+230,y:y0-8,'text-anchor':'middle',class:'m'},sv);
    for(let i=0;i<5;i++){const y=y0+i*34,c=i?PC[i-1]:'var(--accent)';
      rowv(x,y,i?EMB[i-1]:[0,0],c,labs[i]);rowv(x+100,y,POS[i],'var(--muted)');rowv(x+200,y,Z0[i],c)}
    if(f.enc){el('rect',{x:440,y:62,width:120,height:176,rx:10,fill:'var(--accent-bg)',stroke:'var(--accent)'},sv);
      txt('encoder × L',{x:500,y:140,'text-anchor':'middle',class:'big'},sv);txt('Pre-LN，不遮挡',{x:500,y:162,'text-anchor':'middle',class:'m'},sv);
      el('line',{x1:422,y1:150,x2:438,y2:150,stroke:'var(--muted)','stroke-width':2},sv);
      el('line',{x1:560,y1:82,x2:610,y2:82,stroke:'var(--accent)','stroke-width':3},sv);
      el('rect',{x:560,y:260,width:110,height:40,rx:8,fill:'var(--accent)',opacity:.85},sv);
      txt('分类头 → 猫?',{x:615,y:285,'text-anchor':'middle',class:'v'},sv).style.fill='#fff';
      el('line',{x1:615,y1:82,x2:615,y2:258,stroke:'var(--accent)','stroke-width':3},sv);
      txt('只取第 0 行 z_L⁰',{x:672,y:54,'text-anchor':'end',class:'v'},sv).style.fill='var(--accent)';
      txt('序列 5 × 2（论文 197 × 768）',{x:250,y:270,'text-anchor':'middle',class:'m'},sv)}
    else txt('E_pos 也是学出来的；论文是 197 行 × 768',{x:250,y:270,'text-anchor':'middle',class:'m'},sv);
    return}
  grid(f.split);
  if(f.flat){const x=f.emb?300:330;txt('按行展平',{x:x+68,y:82,'text-anchor':'middle',class:'m'},sv);
    PATCH.forEach((p,i)=>rowv(x,96+i*40,p,PC[i],`块 ${i+1}`));
    if(f.emb){txt('× E',{x:448,y:172,'text-anchor':'middle',class:'big'},sv);
      txt('E 第 1 列 [¼ ¼ ¼ ¼]，第 2 列 [1 1 −1 −1]',{x:470,y:290,'text-anchor':'middle',class:'m'},sv);
      EMB.forEach((e,i)=>rowv(480,96+i*40,e,PC[i],null,44));
      txt('平均亮度',{x:500,y:82,'text-anchor':'middle',class:'m'},sv);txt('上 − 下',{x:546,y:82,'text-anchor':'middle',class:'m'},sv)}}
  if(f.split&&!f.flat){txt('N = HW / P² = 4 × 4 / 2² = 4',{x:330,y:150,class:'big'},sv);txt('论文：224 × 224 / 16² = 196 块',{x:330,y:180,class:'big'},sv);txt('每块 16 × 16 × 3 = 768 个数',{x:330,y:210,class:'m'},sv)}
  if(!f.split)txt('Transformer 只会读"一串词"：图片得先变成一串',{x:400,y:180,class:'big'},sv);
}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=FR.length-1)return false;k++;draw();return true}
$('p').oninput=e=>{ANIM.stop();custom=PS[+e.target.value];$('pv').textContent=custom;draw()};
setupPlayer({captureSeed:1,reset,next},1600);
</script><a href="https://wikieden.github.io/ai-books/" style="position:fixed;right:12px;bottom:12px;z-index:99;padding:4px 10px;border-radius:14px;background:rgba(127,127,127,.18);color:inherit;font:13px/1.6 system-ui,sans-serif;text-decoration:none">← 全部讲义书</a>
</body></html>
