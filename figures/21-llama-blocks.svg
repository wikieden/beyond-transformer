<text x="190.0" y="228.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">相加 → LayerNorm</text>
<line x1="190.0" y1="254.0" x2="190.0" y2="242.0" stroke="#4b5563" stroke-width="1.6"/>
