<rect x="520.0" y="162.0" width="260.0" height="34.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" opacity="1"/>
<text x="650.0" y="182.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">相加；RMSNorm</text>
<line x1="650.0" y1="208.0" x2="650.0" y2="196.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="650.0,196.0 654.2,203.9 645.8,203.9" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="520.0" y="116.0" width="260.0" height="34.0" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4" opacity="1"/>
<text x="650.0" y="136.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">FFN：SwiGLU，d_ff = 8d/3</text>
<line x1="650.0" y1="162.0" x2="650.0" y2="150.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="650.0,150.0 654.2,157.9 645.8,157.9" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
<rect x="520.0" y="70.0" width="260.0" height="34.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4" opacity="1"/>
<text x="650.0" y="90.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">相加 → 输出（无 bias）</text>
<line x1="650.0" y1="116.0" x2="650.0" y2="104.0" stroke="#4b5563" stroke-width="1.6"/>
<polygon points="650.0,104.0 654.2,111.9 645.8,111.9" fill="#4b5563" stroke="#4b5563" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
