<text x="650.0" y="228.6" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2937" text-anchor="middle" font-weight="normal">多头注意力（RoPE 转 q、k）</text>
<line x1="650.0" y1="254.0" x2="650.0" y2="242.0" stroke="#4b5563" stroke-width="1.6"/>
