<text x="16.0" y="320.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">上排蓝箭头是前向，框里是这一步的值；下排橙箭头是反向，框里是 loss 对这一步的梯度。ReLU 关掉的第 1 个单元（a₁ = −1.5）梯度变成 0。</text>
