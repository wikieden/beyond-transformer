<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="16.0" y="26.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="17" fill="#1f2937" text-anchor="start" font-weight="bold">残差流：每层往同一条主干上写</text>
<text x="16.0" y="290.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">灰色粗线是残差流。第 1 层把“我前面是谁”写进后 5 维；第 2 层的 key 读后 5 维，query、value 读前 5 维，结果加回去。</text>
