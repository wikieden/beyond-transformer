<text x="16.0" y="320.0" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">左：论文的 Post-LN，残差相加后再 norm；右：源码的 Pre-LN，只在进子层前 norm，主干（灰线）不经过 norm，最后补一个 LN。</text>
